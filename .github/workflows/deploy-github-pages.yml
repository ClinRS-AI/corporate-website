# Build static export (`out/`) and deploy to GitHub Pages.
#
# One-time repo setup:
# 1. Settings → Pages → Build and deployment → Source: GitHub Actions
# 2. After first successful run: Settings → Pages → Custom domain + HTTPS (see README).
#
# Requires: next.config.mjs with output: "export" (and images.unoptimized for next/image).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Custom domain (e.g. www.clinrs.ai) is served at the site root — do not set BASE_PATH.
      # To preview the legacy project URL https://<org>.github.io/<repo>/ locally, build with
      # BASE_PATH=/<repo> (see README).
      - name: Build static site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
